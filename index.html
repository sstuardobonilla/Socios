<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hazte Socio | Primera Compañía de Bomberos "Bomba Aconcagua"</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           VARIABLES CSS & THEME CONFIGURATION
           ========================================================================== */
        :root {
            --primary-red: #D32F2F;
            --primary-red-hover: #B71C1C;
            --primary-red-light: #FFEBEE;
            --dark-black: #121212;
            --off-black: #1E1E1E;
            --light-bg: #F8F9FA;
            --pure-white: #FFFFFF;
            --text-main: #212529;
            --text-muted: #6C757D;
            --border-color: #E0E0E0;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        /* ==========================================================================
           RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-body);
            color: var(--text-main);
            background-color: var(--pure-white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            font-weight: 800;
            line-height: 1.2;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* ==========================================================================
           HEADER & NAVIGATION
           ========================================================================== */
        .header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-sm);
            z-index: 1000;
            border-bottom: 3px solid var(--primary-red);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 48px;
            height: 48px;
            background: var(--primary-red);
            color: var(--pure-white);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 900;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.3);
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-title {
            font-size: 1.1rem;
            color: var(--dark-black);
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 0.8rem;
            color: var(--primary-red);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-link {
            font-weight: 600;
            color: var(--off-black);
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .nav-link:hover {
            color: var(--primary-red);
        }

        .btn-donate-nav {
            background-color: var(--primary-red);
            color: var(--pure-white);
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-donate-nav:hover {
            background-color: var(--primary-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        /* ==========================================================================
           HERO SECTION
           ========================================================================== */
        .hero {
            position: relative;
            background: linear-gradient(135deg, rgba(18, 18, 18, 0.92) 0%, rgba(30, 30, 30, 0.88) 100%), 
                        url('Escudo.jpeg') center/cover no-repeat;
            color: var(--pure-white);
            padding: 6rem 1.5rem;
            text-align: center;
            overflow: hidden;
        }

        .hero-content {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(211, 47, 47, 0.2);
            border: 1px solid var(--primary-red);
            color: #FF6B6B;
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: 3.2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hero-slogan {
            color: var(--primary-red);
            background: linear-gradient(45deg, #FF5252, #FF1744);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .hero-description {
            font-size: 1.2rem;
            color: #E0E0E0;
            max-width: 750px;
            margin: 0 auto 2.5rem;
            font-weight: 400;
        }

        .hero-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-hero-primary {
            background-color: var(--primary-red);
            color: var(--pure-white);
            padding: 1rem 2.5rem;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 1.1rem;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-hero-primary:hover {
            background-color: var(--primary-red-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(211, 47, 47, 0.5);
        }

        .btn-hero-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--pure-white);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 1.1rem;
            transition: var(--transition-smooth);
        }

        .btn-hero-secondary:hover {
            background-color: var(--pure-white);
            color: var(--dark-black);
        }

        /* ==========================================================================
           METRICS / IMPACT COUNTER
           ========================================================================== */
        .impact-section {
            background-color: var(--off-black);
            color: var(--pure-white);
            padding: 2.5rem 1.5rem;
            border-bottom: 1px solid #333;
        }

        .impact-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            text-align: center;
        }

        .impact-item {
            padding: 1rem;
        }

        .impact-number {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-red);
            font-family: var(--font-heading);
            margin-bottom: 0.2rem;
        }

        .impact-label {
            font-size: 0.9rem;
            color: #A0A0A0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* ==========================================================================
           MAIN DONATION SECTION & FORM
           ========================================================================== */
        .donation-section {
            padding: 5rem 1.5rem;
            background-color: var(--light-bg);
        }

        .section-header {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 3.5rem;
        }

        .section-title {
            font-size: 2.2rem;
            color: var(--dark-black);
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        .donation-card {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--pure-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .card-header-tabs {
            display: flex;
            background-color: #F1F3F5;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 1.2rem;
            background: none;
            border: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab-btn.active {
            background-color: var(--pure-white);
            color: var(--primary-red);
            border-bottom: 3px solid var(--primary-red);
        }

        .form-body {
            padding: 2.5rem;
        }

        /* Amount Selection Grid */
        .form-group-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-black);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .amounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .amount-btn {
            background-color: var(--pure-white);
            border: 2px solid var(--border-color);
            padding: 1rem;
            border-radius: var(--radius-md);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--off-black);
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
        }

        .amount-btn:hover {
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .amount-btn.selected {
            background-color: var(--primary-red-light);
            border-color: var(--primary-red);
            color: var(--primary-red);
        }

        .custom-amount-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .custom-amount-wrapper span {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 700;
            color: var(--text-muted);
        }

        .custom-amount-input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.5rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        .custom-amount-input:focus {
            outline: none;
            border-color: var(--primary-red);
        }

        /* Donor Info Inputs */
        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--off-black);
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: var(--font-body);
            transition: var(--transition-smooth);
            background-color: #FAFAFA;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-red);
            background-color: var(--pure-white);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        /* Summary Panel */
        .donation-summary {
            background-color: var(--light-bg);
            border-radius: var(--radius-md);
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary-red);
        }

        .summary-label {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .summary-value {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--dark-black);
            font-family: var(--font-heading);
        }

        /* Submit Button */
        .btn-submit-donation {
            width: 100%;
            background-color: var(--primary-red);
            color: var(--pure-white);
            padding: 1.2rem;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit-donation:hover {
            background-color: var(--primary-red-hover);
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
        }
